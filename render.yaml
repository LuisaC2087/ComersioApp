# ============================================================
#  Blueprint de Render: crea TODO con un solo clic
#  (Render > New > Blueprint > selecciona este repositorio)
#
#  - 1 base de datos PostgreSQL (gratis)
#  - 3 microservicios Node.js (gratis)
#  - 1 sitio web estático con la app Expo para navegador (gratis)
#
#  VARIABLES DE ENTORNO
#  Se ven y se editan en Render > servicio > Environment.
#  Si cambias una que tiene "value" aquí, cámbiala también en este archivo,
#  o Render la restaurará cuando sincronice el Blueprint.
#  Las URLs son las que Render asignó (con sufijo, ej. -dxd5).
# ============================================================

databases:
  - name: tienda-db
    plan: free
    databaseName: tienda
    user: tienda

# Secreto compartido: los 3 servicios usan el MISMO JWT_SECRET
# para crear y validar los tokens de sesión.
envVarGroups:
  - name: tienda-secretos
    envVars:
      - key: JWT_SECRET
        generateValue: true

services:
  # ---------- Usuarios: registro y login ----------
  - type: web
    name: tienda-usuarios
    runtime: node
    plan: free
    rootDir: backend/usuarios
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL          # URL de la base de datos
        fromDatabase:
          name: tienda-db
          property: connectionString
      - fromGroup: tienda-secretos

  # ---------- Productos: catálogo ----------
  - type: web
    name: tienda-productos
    runtime: node
    plan: free
    rootDir: backend/productos
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tienda-db
          property: connectionString
      # El mismo secreto de los demás: valida el token del administrador
      - fromGroup: tienda-secretos

  # ---------- Pedidos: pago simulado, facturas, historial ----------
  - type: web
    name: tienda-pedidos
    runtime: node
    plan: free
    rootDir: backend/pedidos
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tienda-db
          property: connectionString
      - fromGroup: tienda-secretos
      - key: IVA
        value: "0.12"

  # ---------- Frontend: la app Expo exportada para navegador ----------
  - type: web
    name: tienda-web
    runtime: static
    rootDir: mobile
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      # URLs públicas de los microservicios (cópialas del panel de Render)
      - key: EXPO_PUBLIC_USUARIOS_URL
        value: https://tienda-usuarios.onrender.com
      - key: EXPO_PUBLIC_PRODUCTOS_URL
        value: https://tienda-productos-dxd5.onrender.com
      - key: EXPO_PUBLIC_PEDIDOS_URL
        value: https://tienda-pedidos-brue.onrender.com
      - key: EXPO_PUBLIC_MONEDA
        value: Q
      - key: EXPO_PUBLIC_IVA
        value: "0.12"
      - key: EXPO_PUBLIC_TIENDA_NOMBRE
        value: Glass Store
    # Todas las rutas (/carrito, /factura/3, ...) las resuelve Expo Router
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
