# ============================================================
#  Blueprint de Render: crea TODO con un solo clic
#  (Render > New > Blueprint > selecciona este repositorio)
#
#  - 1 base de datos PostgreSQL (gratis)
#  - 3 microservicios Node.js (gratis)
#  - 1 sitio web estático con la app Expo para navegador (gratis)
#
#  VARIABLES DE ENTORNO
#  - Las que tienen "sync: false" se configuran en el panel de Render
#    (servicio > Environment). Render las pide al crear el Blueprint.
#  - Las que tienen "value" o "fromDatabase" se llenan solas, y también
#    se pueden ver y editar en Environment.
# ============================================================

databases:
  - name: tienda-db
    plan: free
    databaseName: tienda
    user: tienda

# Secreto compartido: los 3 servicios usan el MISMO JWT_SECRET
# para crear y validar los tokens de sesión.
envVarGroups:
  - name: tienda-secretos
    envVars:
      - key: JWT_SECRET
        generateValue: true

services:
  # ---------- Usuarios: registro y login ----------
  - type: web
    name: tienda-usuarios
    runtime: node
    plan: free
    rootDir: backend/usuarios
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL          # URL de la base de datos
        fromDatabase:
          name: tienda-db
          property: connectionString
      - fromGroup: tienda-secretos

  # ---------- Productos: catálogo ----------
  - type: web
    name: tienda-productos
    runtime: node
    plan: free
    rootDir: backend/productos
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tienda-db
          property: connectionString

  # ---------- Pedidos: pago simulado, facturas, historial ----------
  - type: web
    name: tienda-pedidos
    runtime: node
    plan: free
    rootDir: backend/pedidos
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tienda-db
          property: connectionString
      - fromGroup: tienda-secretos
      - key: PRODUCTOS_URL         # URL pública del servicio de productos
        sync: false
      - key: IVA
        value: "0.12"

  # ---------- Frontend: la app Expo exportada para navegador ----------
  - type: web
    name: tienda-web
    runtime: static
    rootDir: mobile
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      # URLs públicas de los microservicios (cópialas del panel de Render)
      - key: EXPO_PUBLIC_USUARIOS_URL
        sync: false
      - key: EXPO_PUBLIC_PRODUCTOS_URL
        sync: false
      - key: EXPO_PUBLIC_PEDIDOS_URL
        sync: false
      - key: EXPO_PUBLIC_MONEDA
        value: Q
      - key: EXPO_PUBLIC_IVA
        value: "0.12"
      - key: EXPO_PUBLIC_TIENDA_NOMBRE
        value: Glass Store
    # Todas las rutas (/carrito, /factura/3, ...) las resuelve Expo Router
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
